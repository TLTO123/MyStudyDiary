<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Diario de Estudio</h1>
      <div class="streaks">
        <div class="streak" id="streak">
          <span class="streak-fire">🔥</span>
          <span class="streak-number" id="streak-number">0</span>
          <span class="streak-label">días</span>
        </div>
        <div class="streak streak-best" id="best-streak">
          <span class="streak-fire">🏆</span>
          <span class="streak-number" id="best-streak-number">0</span>
          <span class="streak-label">mejor</span>
        </div>
        <div class="streak streak-week" id="week-streak">
          <span class="streak-fire">📊</span>
          <span class="streak-number" id="week-minutes-number">0</span>
          <span class="streak-label">semana</span>
        </div>
        <div class="streak streak-month" id="month-streak">
          <span class="streak-fire">📅</span>
          <span class="streak-number" id="month-days-number">0</span>
          <span class="streak-label">mes</span>
        </div>
      </div>
    </header>

    <section class="card heatmap-card" id="heatmap-card">
      <div class="heatmap-header">
        <h2>Mapa de calor</h2>
        <fieldset class="heatmap-range" id="heatmap-range" role="radiogroup" aria-label="Semanas a mostrar">
          <legend class="visually-hidden">Semanas a mostrar</legend>
          <label><input type="radio" name="heatmap-semanas" value="4"> 4</label>
          <label><input type="radio" name="heatmap-semanas" value="12" checked> 12</label>
          <label><input type="radio" name="heatmap-semanas" value="26"> 26</label>
          <label><input type="radio" name="heatmap-semanas" value="52"> 52</label>
        </fieldset>
      </div>

      <div class="heatmap-container" id="heatmap-container" role="grid" aria-label="Mapa de calor de actividad, semanas horizontales, días verticales">
        <div class="heatmap-labels" id="heatmap-labels" aria-hidden="true">
          <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
        </div>
        <div class="heatmap-grid" id="heatmap-grid"></div>
      </div>

      <div class="heatmap-empty hidden" id="heatmap-empty">
        <p>Aún no hay datos para el mapa de calor</p>
        <button type="button" id="heatmap-empty-btn">Añade tu primera sesión</button>
      </div>
    </section>

    <section class="card form-card">
      <h2>Nueva sesión</h2>
      <form id="session-form">
        <div class="field">
          <label for="date">Fecha</label>
          <input type="date" id="date" name="date" required>
        </div>
        <div class="field">
          <label for="topic">Tema</label>
          <input type="text" id="topic" name="topic" placeholder="Ej: JavaScript, React, Algoritmos..." required maxlength="100">
        </div>
        <div class="field">
          <label for="minutes">Minutos</label>
          <input type="number" id="minutes" name="minutes" min="1" placeholder="Ej: 45" required>
        </div>
        <button type="submit" class="btn btn-primary">Guardar sesión</button>
      </form>
    </section>

    <section class="card list-card">
      <h2>Sesiones</h2>
      <ul id="sessions-list" class="sessions-list"></ul>
      <p id="empty-message" class="empty-message hidden">Aún no hay sesiones. ¡Añade la primera arriba!</p>
    </section>

    <!-- Modal día -->
    <div class="modal hidden" id="day-modal" role="dialog" aria-modal="true" aria-labelledby="day-modal-title">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <header class="modal-header">
          <h3 id="day-modal-title">Detalle del día</h3>
          <button type="button" class="modal-close" aria-label="Cerrar">×</button>
        </header>
        <div class="modal-body">
          <p class="day-date" id="day-modal-date"></p>
          <p class="day-total" id="day-modal-total"></p>
          <ul class="day-sessions" id="day-modal-sessions"></ul>
          <p class="day-empty hidden" id="day-modal-empty">Sin sesiones ese día</p>
        </div>
      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
